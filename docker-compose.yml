services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: web_commander
    restart: always
    ports:
      - '80:80'   # Tráfico HTTP
      - '81:81'   # Panel de Administración Web
      - '443:443' # Tráfico HTTPS (SSL)
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
